[package]
name = "rview"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast terminal image viewer with Kitty graphics protocol support"
license = "MIT"
repository = "https://github.com/jrf/rview"
homepage = "https://github.com/jrf/rview"

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
base64 = "0.22"
nucleo-matcher = "0.3"
lru = "0.12"
rayon = "1"
turbojpeg = { version = "1", optional = true }
fast_image_resize = "6.0.0"
directories = "6"
trash = "5.2"
ffmpeg = { version = "8", optional = true, package = "ffmpeg-next" }

[features]
default = ["turbo"]
turbo = ["dep:turbojpeg"]
video = ["dep:ffmpeg"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
strip = true
